spring.application.name=AI-Service

server.port=9500

gemini.api.key=${GEMINI_API_KEY}
groq.api.key=${GROQ_API_KEY}

#RAG (Qdrant - cloud vector DB)
rag.qdrant.host=${QDRANT_HOST}
rag.qdrant.port=${QDRANT_PORT:6334}
rag.qdrant.api-key=${QDRANT_API_KEY}
rag.qdrant.collection=${QDRANT_COLLECTION:pulsecare-prescriptions}


spring.cloud.loadbalancer.retry.enabled=true

spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

resilience4j.retry.instances.AppointmentClient.max-attempts=5
resilience4j.retry.instances.AppointmentClient.wait-duration=2s

#RAG (PG Vector)
#rag.pgvector.host=${RAG_DB_HOST:localhost}
#rag.pgvector.port=${RAG_DB_PORT:5432}
#rag.pgvector.database=${RAG_DB_NAME:hms_ai_embeddings}
#rag.pgvector.user=${RAG_DB_USER}
#rag.pgvector.password=${RAG_DB_PASSWORD}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true